name: build-and-test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore BlastManagement.sln

      - name: Build
        run: dotnet build BlastManagement.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test BlastManagement.sln --configuration Release --no-build --collect:"XPlat Code Coverage"
